name: build-apk
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble APK (target SDK 34)
        shell: bash
        run: |
          mkdir -p out
          pip install --quiet pillow
          ICON=app/src/main/res/drawable-nodpi/ic_launcher.png
          python3 tools/gen_icon.py $ICON "$GITHUB_SHA"
          gradle --no-daemon assembleDebug  2>&1 | tee gradle.log
          cp app/build/outputs/apk/debug/app-debug.apk out/camera-target34.apk

      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          t = open("gradle.log", errors="replace").read()
          lines = [l for l in t.splitlines() if re.search(r"error|FAILED|wrong|Could not|not found|Unresolved|cannot find|What went", l, re.I)]
          msg = "\n".join(lines[:40]) or t[-3000:]
          msg = msg.replace("%","%25").replace("\r","%0D").replace("\n","%0A")
          print("::error title=gradle::" + msg[:3500])
          PY

      - name: List APK contents
        if: always()
        run: |
          APK=$(ls out/*.apk | head -1)
          L=$(unzip -l "$APK" | grep -E "lib/|AndroidManifest|classes.dex" | awk '{printf "%s %s%%0A", $1, $4}')
          echo "::notice title=apk-contents::$L"

      - uses: actions/upload-artifact@v4
        with:
          name: camera-debug-apk
          path: out/*.apk
